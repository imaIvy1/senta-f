<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b7e3ed">
  <!-- 解锁前，浏览器标题也不透露生日或礼物。 -->
  <title>Simply——</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js?v=2"></script>
  <script defer src="app.js?v=2"></script>
</head>
<body>
  <!-- 背景只用 CSS 绘制，不依赖外部图片。装饰全部从无障碍阅读树中排除。 -->
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b>✧</b><b>✧</b><b>✧</b></div>

  <!-- 入口仅有提示、密码框和提交按钮。错误信息为空，出错时才出现。 -->
  <section id="gate">
    <form id="unlock-form" class="window login-window">
      <div class="titlebar login-titlebar" aria-hidden="true"><span class="mini-orb"></span><span class="window-decoration">−　□　×</span></div>
      <div class="login-body">
        <label id="key-hint" for="key">Simply——</label>
        <div class="input-row"><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter password" aria-describedby="key-error" required><button class="classic" type="submit" aria-label="Enter">↵</button></div>
        <p id="key-error" role="status" aria-live="polite"></p>
      </div>
    </form>
  </section>

  <!-- 桌面：主要窗口可最小化、最大化；任务栏与图标可重新打开窗口。 -->
  <main id="desktop" hidden>
    <nav class="desktop-icons" aria-label="Desktop">
      <button id="desktop-memory" class="desktop-icon"><span class="computer-icon" aria-hidden="true"></span><span>My Memories</span></button>
      <button id="desktop-letter" class="desktop-icon" hidden><span class="envelope-icon" aria-hidden="true"></span><span>Letter.txt</span></button>
    </nav>

    <section id="collection-window" class="window collection-window" aria-label="Memory Collection">
      <header class="titlebar"><span><span class="mini-orb" aria-hidden="true"></span> Memory Collection</span><div class="window-controls"><button id="minimize" aria-label="Minimize" title="Minimize">−</button><button id="maximize" aria-label="Maximize" title="Maximize" aria-pressed="false">□</button><button id="lock" aria-label="Lock" title="Lock">×</button></div></header>
      <div class="toolbar"><button id="back" class="classic" disabled>← Back</button><span class="toolbar-divider"></span><span class="address-label">Address</span><output id="address">My Computer / Memories</output><button id="next-box" class="classic" title="Next box">Next →</button></div>

      <div class="workspace">
        <aside class="explorer"><div class="explorer-heading">Folders</div><nav id="box-tabs" aria-label="Memory boxes"></nav><div class="explorer-bottom"><span id="opened-count">0 / 4 opened</span><div class="progress-track" aria-hidden="true"><span id="progress"></span></div></div></aside>

        <!-- 环形陈列与开盖详情共用同一个区域，开盖前不把照片暴露在封面上。 -->
        <section id="stage-pane" aria-label="Collection">
          <div id="ring-view"><div class="ring-track" aria-hidden="true"></div><div id="box-ring"></div><div class="ring-controls"><button id="previous" class="classic arrow" aria-label="Previous box">◀</button><button id="open-box" class="classic accent">Open</button><button id="next" class="classic arrow" aria-label="Next box">▶</button></div><div id="selection-name">Fridge</div></div>
          <div id="open-view" hidden><div id="opening-object"></div><div id="photo-grid" aria-label="Photos"></div></div>
        </section>
      </div>
      <footer class="statusbar"><span id="status-text">4 objects</span><span id="selection-count">01 / 04</span><span class="resize-grip" aria-hidden="true">◢</span></footer>
    </section>

    <!-- 信是独立窗口。第四盒退出时自动显示一次；Back 后仍可从桌面再次打开。 -->
    <section id="letter-window" class="window letter-window" aria-labelledby="letter-title" hidden>
      <header class="titlebar"><span id="letter-title">Letter.txt</span><button id="letter-close" class="window-close" aria-label="Back to boxes">×</button></header>
      <div class="toolbar"><button id="letter-back" class="classic">← Back</button><button id="letter-zoom" class="classic">Zoom in</button></div>
      <div id="letter-scroll">
        <!-- 先用 CEF 手写字体写出提示，再出现可点击的信封；拆开后才展示原信。 -->
        <div id="letter-intro">
          <p id="letter-intro-text" lang="zh-CN">等等，还有最后一份祝福。</p>
          <button id="letter-envelope" aria-label="Open envelope" hidden>
            <span class="letter-envelope-paper" aria-hidden="true"><img id="letter-peek" alt=""></span>
            <span class="letter-envelope-pocket" aria-hidden="true"></span>
            <span class="letter-envelope-flap" aria-hidden="true"></span>
            <span class="letter-envelope-seal" aria-hidden="true">S</span>
          </button>
        </div>
        <img id="letter-image" alt="Handwritten letter" hidden>
      </div>
      <footer class="statusbar"><span>1 document</span><span>Read only</span></footer>
    </section>

    <nav id="start-menu" class="window" hidden aria-label="Start menu"><button id="start-memory" class="classic">My Memories</button><button id="start-letter" class="classic" hidden>Letter.txt</button><button id="start-lock" class="classic">Lock</button></nav>
    <footer class="taskbar"><button id="start" class="classic" aria-expanded="false"><span class="start-icon" aria-hidden="true">▦</span> Start</button><span class="taskbar-divider"></span><button id="task-memory" class="classic task-button">Memory Collection</button><div class="music-panel"><span class="music-icon" aria-hidden="true">♫</span><span id="music-title">Hey Jude</span><button id="music-toggle" class="classic" aria-label="Pause music">Pause</button><span id="clock">09:20</span></div></footer>
  </main>

  <!-- 原生 dialog 提供焦点约束与 Escape 关闭；双面拍立得用 CSS rotateY。 -->
  <dialog id="photo-dialog" class="window" aria-labelledby="photo-title">
    <header class="titlebar"><span id="photo-title">Photo Viewer</span><button id="photo-close" class="window-close" aria-label="Close photo">×</button></header>
    <div class="photo-toolbar"><button id="photo-prev" class="classic" aria-label="Previous photo">◀</button><output id="photo-position"></output><button id="photo-next" class="classic" aria-label="Next photo">▶</button><button id="photo-zoom" class="classic">Zoom in</button><button id="flip-button" class="classic" aria-pressed="false" hidden>Flip ↻</button></div>
    <div id="photo-viewport"><img id="photo-image" alt=""><button id="polaroid" aria-label="Flip polaroid" hidden><span class="flip-inner"><span class="flip-face front"><img id="polaroid-front" alt="Polaroid front"></span><span class="flip-face back" aria-hidden="true"><img id="polaroid-back" alt="Polaroid back"></span></span></button></div>
    <p id="photo-caption" class="photo-caption" lang="zh-CN"></p>
  </dialog>
  <audio id="bgm" loop preload="none"></audio>
</body>
</html>
